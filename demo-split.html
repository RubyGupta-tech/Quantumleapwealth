    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 1 - Ultra-Premium Split</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .hero-split { display: flex; height: 100vh; }
        .hero-left { 
            flex: 1; 
            background: #0f172a; /* Navy Blue */
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 8% 10%; 
        }
        .hero-right { 
            flex: 1; 
            background: url('images/partners_bg_light.png') center/cover no-repeat; 
            position: relative;
        }
        .hero-right::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #0f172a 0%, transparent 15%);
        }
        h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 24px; font-weight: 800; letter-spacing: -1px; }
        h1 span { color: #c9a84c; /* Gold */ }
        p { font-size: 1.15rem; color: #cbd5e1; margin-bottom: 40px; max-width: 500px; line-height: 1.7; }
        .btn-group { display: flex; gap: 16px; }
        .btn { 
            padding: 16px 36px; 
            background: #c9a84c; 
            color: white; 
            text-decoration: none; 
            font-weight: 700; 
            border-radius: 50px; 
            transition: all 0.3s;
        }
        .btn:hover { background: #b0923b; transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="hero-split">
        <div class="hero-left">
            <div>
                <div style="color:#c9a84c; font-weight:700; letter-spacing:1px; margin-bottom:16px; font-size:0.9rem;">QUANTUM LEAP WEALTH</div>
                <h1>Build Your Legacy<br>With <span>Confidence.</span></h1>
                <p>We provide exclusive, high-end financial advisory mapping your exact route to wealth preservation and generational freedom.</p>
                <div class="btn-group">
                    <a href="#" class="btn">Start Your Journey</a>
                    <a href="#" class="btn btn-outline">View Our Services</a>
                </div>
            </div>
        </div>
        <div class="hero-right"></div>
    </div>
</body>
