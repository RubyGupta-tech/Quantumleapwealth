<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subscription Successful | Quantum Leap Wealth</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #090f1e, #1a2540);
      padding: 100px 20px;
    }
    .success-box {
      background: #fff;
      padding: 60px 40px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .success-box h1 {
      color: #0b1d42;
      margin-bottom: 10px;
      font-size: 2.5rem;
      font-family: 'Playfair Display', serif;
    }
    .success-box p {
      color: #555;
      margin-bottom: 30px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .success-btn {
      display: inline-block;
      padding: 15px 35px;
      background: #c9a84c;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      transition: background 0.2s;
    }
    .success-btn:hover {
      background: #b5953e;
    }
  </style>
</head>
<body>
  <div class="success-page">
    <div class="success-box">
      <div style="font-size: 4rem; margin-bottom: 20px;">🎉</div>
      <h1>Thank You!</h1>
      <p>Your subscription was successful. You're now on the list to receive our latest financial insights and exclusive updates!</p>
      <a href="index.html" class="success-btn">Return to Home</a>
    </div>
  </div>
</body>
</html>
