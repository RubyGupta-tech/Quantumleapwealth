<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Design Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #0a2540;
        --accent: #c9a84c;
        --accent-light: #e8c678;
        --accent-dark: #a07a28;
      }
      body { margin: 0; font-family: 'Inter', sans-serif; background: #0f172a; overflow: hidden;}

      .hero-split-section {
        display: flex;
        height: 100vh;
        width: 100%;
        background: radial-gradient(circle at 20% 50%, #1e293b 0%, #0f172a 100%);
        position: relative;
        overflow: hidden;
      }

      /* Background Pattern Overlay */
      .hero-split-section::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(rgba(232, 198, 120, 0.08) 1.5px, transparent 1.5px);
        background-size: 40px 40px;
        z-index: 1;
        pointer-events: none;
      }

      /* Left Side Visual Design */
      .hero-bg-design-left {
        position: absolute;
        width: 1000px;
        height: 1000px;
        top: 50%;
        left: 20%;
        transform: translate(-50%, -50%);
        background: 
          radial-gradient(circle, rgba(15, 23, 42, 0) 0%, #0f172a 85%),
          url('images/hero_prosperity.png?v=1') center/cover no-repeat;
        z-index: 1;
        pointer-events: none;
        opacity: 0.7;
        border-radius: 50%;
        box-shadow: 0 0 100px 50px #0f172a inset;
      }

      @keyframes rotateDesign {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .hero-split-left {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 10%;
        z-index: 10;
        color: white;
      }

      .hero-split-left-content { max-width: 600px; }

      .hero-split-title {
        font-family: 'Playfair Display', serif;
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 20px;
        line-height: 1.1;
      }

      .shimmer-text {
        background: linear-gradient(to right, #e8c678 20%, #fff 50%, #e8c678 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: shimmer 4s linear infinite;
      }

      @keyframes shimmer { to { background-position: 200% center; } }
    </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
    <section class="hero-split-section">
        <div class="hero-bg-design-left"></div>
        <div class="hero-split-left">
            <div class="hero-split-left-content">
                <h1 class="hero-split-title">
                    Built on <span class="shimmer-text">Strategy.</span><br>
                    Driven by <span class="shimmer-text">Purpose.</span>
                </h1>
                <p style="font-size:1.1rem; opacity:0.8; line-height:1.6; margin-bottom:30px;">
                    At Quantum Leap Wealth, we believe financial planning should be intentional, structured, and built for long-term security.
                </p>
                <div style="display:flex; gap:20px;">
                    <div style="background:#c9a84c; color:white; padding:15px 40px; border-radius:50px; font-weight:700; cursor:pointer;">Our Story</div>
                    <div style="border:1px solid white; color:white; padding:15px 40px; border-radius:50px; font-weight:700; cursor:pointer;">Consultation</div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
